<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 890" width="1600" height="890" role="img" aria-label="How an invoice becomes validated JSON and a short review list"><title>How an invoice becomes validated JSON and a short review list</title><defs><marker id="dk-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1600" height="890" rx="28" fill="#e9e9e7" data-id="canvas"/><text x="64.0" y="84.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="2" data-box="canvas">FDE PORTFOLIO · 03</text><text x="64.0" y="128.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="canvas">How an invoice becomes validated JSON and a short review list</text><rect x="64.0" y="293.0" width="218.9" height="310.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="upload"/><text x="86.0" y="329.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="upload">INPUT</text><text x="86.0" y="367.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="upload">Upload</text><text x="86.0" y="401.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">Supplier invoice or</text><text x="86.0" y="425.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">courier delivery note</text><text x="86.0" y="449.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">PDF, PNG or JPEG,</text><text x="86.0" y="473.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">checked by magic bytes</text><text x="86.0" y="497.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">10 MB, 10 pages, image</text><text x="86.0" y="521.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="upload">size caps</text><rect x="338.9" y="293.0" width="218.9" height="310.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="read"/><text x="360.9" y="329.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="read">READER</text><text x="360.9" y="367.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="read">Text layer or</text><text x="360.9" y="397.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="read">OCR</text><text x="360.9" y="431.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">pypdf in layout mode</text><text x="360.9" y="455.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">first</text><text x="360.9" y="479.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">rapidocr only for pages</text><text x="360.9" y="503.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">with no text</text><text x="360.9" y="527.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">OCR keeps line</text><text x="360.9" y="551.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">positions and</text><text x="360.9" y="575.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="read">per-segment confidence</text><rect x="613.9" y="199.0" width="372.2" height="498.0" rx="16" fill="#fe6608" stroke="none" stroke-width="1.5" data-id="core"/><text x="635.9" y="235.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#141414" text-anchor="start" letter-spacing="1.5" data-box="core">EXTRACT AND CHECK</text><text x="635.9" y="277.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">fusion27b:iq3 via Ollama</text><text x="635.9" y="305.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="core">Local, one RTX 5080, no cloud call</text><rect x="635.9" y="325.0" width="328.2" height="154.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5" data-id="extract"/><text x="657.9" y="369.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="extract">Extract</text><text x="657.9" y="403.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="extract">One call with a JSON schema</text><text x="657.9" y="427.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="extract">One repair round for invalid JSON</text><text x="657.9" y="451.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="extract">Text is treated as untrusted data</text><rect x="635.9" y="497.0" width="328.2" height="178.0" rx="16" fill="#141414" stroke="none" stroke-width="1.5" data-id="validate"/><text x="657.9" y="541.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#e9e9e7" text-anchor="start" letter-spacing="0.0" data-box="validate">Validate in code</text><text x="657.9" y="575.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="validate">GSTIN mod-36 checksum, dates, line</text><text x="657.9" y="599.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="validate">sums</text><text x="657.9" y="623.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="validate">Subtotal + GST = total</text><text x="657.9" y="647.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#c9c7c2" text-anchor="start" letter-spacing="0.0" data-box="validate">Duplicate invoice number per supplier</text><rect x="1042.1" y="196.0" width="218.9" height="262.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="confidence"/><text x="1064.1" y="232.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="confidence">SIGNAL</text><text x="1064.1" y="270.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="confidence">Confidence per</text><text x="1064.1" y="300.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="confidence">field</text><text x="1064.1" y="334.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="confidence">Low if a rule flagged it</text><text x="1064.1" y="358.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="confidence">Low if the value is not</text><text x="1064.1" y="382.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="confidence">in the source text</text><text x="1064.1" y="406.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="confidence">Low if OCR confidence</text><text x="1064.1" y="430.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="confidence">is under 0.70</text><rect x="1042.1" y="492.0" width="218.9" height="208.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="status"/><text x="1064.1" y="528.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="status">ROUTING</text><text x="1064.1" y="566.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="status">Status</text><text x="1064.1" y="600.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="status">No low field and no</text><text x="1064.1" y="624.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="status">warning: auto_accepted</text><text x="1064.1" y="648.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="status">Anything else waits for</text><text x="1064.1" y="672.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="status">a person</text><rect x="1317.1" y="293.0" width="218.9" height="310.0" rx="16" fill="#ffffff" stroke="#d2d0cb" stroke-width="1.5" data-id="review"/><text x="1339.1" y="329.0" font-family="Cascadia Mono, SFMono-Regular, Consolas, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fe6608" text-anchor="start" letter-spacing="1.5" data-box="review">PERSON</text><text x="1339.1" y="367.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="review">Review and</text><text x="1339.1" y="397.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="review">export</text><text x="1339.1" y="431.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">Flagged fields beside</text><text x="1339.1" y="455.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">the document image</text><text x="1339.1" y="479.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">Accept or correct each</text><text x="1339.1" y="503.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">one</text><text x="1339.1" y="527.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">CSV export, safe</text><text x="1339.1" y="551.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">against formula</text><text x="1339.1" y="575.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="review">injection</text><rect x="64.0" y="750.0" width="1472.0" height="76.0" rx="16" fill="#dcdad5" stroke="none" stroke-width="1.5" data-id="band"/><text x="88.0" y="796.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="650" fill="#141414" text-anchor="start" letter-spacing="0.0" data-box="band">SQLite</text><text x="187.7" y="796.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#55534f" text-anchor="start" letter-spacing="0.0" data-box="band">documents, raw model replies, extractions, reviewer decisions</text><text x="1512.0" y="796.0" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="end" letter-spacing="0.0" data-box="band">0 silent errors in 1,130 fields</text><path d="M286.9 448.0 L332.9 448.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M561.9 448.0 L607.9 448.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M990.1 328.5 L1036.1 328.5" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1265.1 375.5 L1311.1 375.5" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M1151.6 462.0 L1151.6 486.0" fill="none" stroke="#141414" stroke-width="2.5" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/><path d="M800.0 701.0 L800.0 744.0" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#dk-a)" stroke-linejoin="round" stroke-linecap="round"/></svg>